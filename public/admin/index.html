    const DEFAULT_OVERLAY_OPACITY = 75;

    function getOverlayGradient(opacity) {
      const n = Number(opacity);
      const safe = (opacity === undefined || opacity === null || opacity === '' || isNaN(n))
        ? DEFAULT_OVERLAY_OPACITY
        : Math.max(0, Math.min(100, n));
      const l = safe / 100;
      const mid = l * (0.4 / 0.75);
      const right = l * (0.1 / 0.75);
      return 'linear-gradient(to right, rgba(0, 0, 0, ' + l + ') 0%, rgba(0, 0, 0, ' + mid + ') 60%, rgba(0, 0, 0, ' + right + ') 100%)';
    }

    // Même formule que overlayGradientVertical() dans src/pages/index.astro
    function getOverlayGradientVertical(opacity) {
      const n = Number(opacity);
      const safe = (opacity === undefined || opacity === null || opacity === '' || isNaN(n))
        ? DEFAULT_OVERLAY_OPACITY
        : Math.max(0, Math.min(100, n));
      const ratio = safe / DEFAULT_OVERLAY_OPACITY;
      const top = 0.4 * ratio;
      const bottom = 0.7 * ratio;
      return 'linear-gradient(to bottom, rgba(0, 0, 0, ' + top + '), rgba(0, 0, 0, ' + bottom + '))';
    }

    // Decap CMS enveloppe le markdown dans des divs internes : `:scope > p` sur .prose-content
    // ne trouve alors aucun paragraphe et l'image tombait toujours en bas. On prend tous les
    // <p> "de contenu" (hors légendes, citations, listes) dans l'ordre du document.
    function getContentParagraphs(container) {
      if (!container) return [];
      return Array.from(container.querySelectorAll('p')).filter(function(p) {
        if (!p.textContent || p.textContent.trim().length === 0) return false;
        if (p.closest('figure, figcaption, blockquote, li')) return false;
        if (p.closest('.injected-hero-figure, .injected-tweet-block')) return false;
        return true;
      });
    }

    // Place un élément dans un conteneur de texte : 0 = au-dessus de tout, N = après le N-ème paragraphe,
    // ou en bas si aucun paragraphe n'est détecté (même logique que insertAtParagraphPosition dans [slug].astro)
    function insertAtParagraphPosition(container, element, targetPos) {
      const paragraphs = getContentParagraphs(container);

      if (paragraphs.length === 0) {
        container.appendChild(element);
      } else if (targetPos <= 0) {
        paragraphs[0].parentNode.insertBefore(element, paragraphs[0]);
      } else {
        const targetIndex = Math.min(targetPos, paragraphs.length) - 1;
        paragraphs[targetIndex].insertAdjacentElement('afterend', element);
      }
    }

    // Retire l'ancienne instance (si présente) puis insère l'élément fraîchement construit à la bonne position.
    // Appelé depuis componentDidMount/componentDidUpdate (et non depuis `ref`) pour garantir un ré-affichage
    // fiable à chaque changement de champ dans l'éditeur (le `ref` React n'est pas ré-invoqué de façon fiable
    // à chaque frappe dans le panneau de preview de Decap CMS).
    function applyParagraphInjection(container, injectedClass, position, buildElement) {
      if (!container) return;
      const existing = container.querySelector('.' + injectedClass);
      if (existing) existing.remove();

      const element = buildElement();
      if (!element) return;
      element.classList.add(injectedClass);
      insertAtParagraphPosition(container, element, position);
    }

    // Le markdown Decap se rend parfois après le 1er cycle React : on observe le DOM
    // et on réessaie un court instant pour placer image/tweet au bon paragraphe.
    function bindPreviewInjection(component) {
      if (component._binding) return;
      component._binding = true;
      if (component._observer) component._observer.disconnect();
      try {
        component.syncPositionedElements();
      } finally {
        component._binding = false;
        if (!component._proseNode) return;
        if (!component._observer || component._observedNode !== component._proseNode) {
          component._observer = new MutationObserver(function() {
            bindPreviewInjection(component);
          });
          component._observedNode = component._proseNode;
        }
        component._observer.observe(component._proseNode, { childList: true, subtree: true });
      }
    }

    function startPreviewInjection(component) {
      bindPreviewInjection(component);
      component._retryTimers = component._retryTimers || [];
      [50, 200, 500].forEach(function(ms) {
        component._retryTimers.push(setTimeout(function() {
          bindPreviewInjection(component);
        }, ms));
      });
    }

    function stopPreviewInjection(component) {
      (component._retryTimers || []).forEach(clearTimeout);
      component._retryTimers = [];
      if (component._observer) component._observer.disconnect();
    }

    // 👁️ Preview Articles (layout classique)

            }
          } catch (err) {}

        if (document.querySelector('[data-preview-anchor]')) return document;
        return null;
      }

        var frames = document.querySelectorAll('iframe');
        for (var i = 0; i < frames.length; i++) {
          try {
            if (frames[i].contentDocument === doc || (frames[i].contentWindow && frames[i].contentWindow.document === doc)) {

      // qui défile réellement. Selon la version de Decap, l'iframe d'aperçu peut soit
      // avoir son propre scroll interne, soit grandir avec son contenu — auquel cas
      // c'est ce conteneur parent qui porte l'ascenseur.
      function findScrollableAncestor(node) {

        while (el && el !== document.body && el !== document.documentElement) {

      // Deux mécanismes de scroll coexistent selon la structure interne de Decap :
      // 1) l'iframe a son propre scroll → scrollIntoView() suffit à l'intérieur.
      // 2) l'iframe grandit avec son contenu (pas de scroll interne) → c'est un
      //    conteneur parent, dans la page d'admin, qui défile réellement.
      // On applique les deux : chacun est un no-op inoffensif si son cas ne s'applique pas.
      function scrollToPreviewEl(el, doc) {
        function apply() {
          if (!el || !el.getBoundingClientRect) return;

          var elRect = el.getBoundingClientRect();

          var elCenterInViewport = iframeRect.top + elRect.top + (elRect.height / 2);
          var scrollerCenterInViewport = scrollerRect.top + (scroller.clientHeight / 2);
          var delta = elCenterInViewport - scrollerCenterInViewport;

          if (Math.abs(delta) > 4) {
            scroller.scrollTo({ top: scroller.scrollTop + delta, behavior: 'smooth' });
          }
        }

        apply();
        scrollTimers.forEach(clearTimeout);
        // Le contenu de l'aperçu peut légèrement bouger après le premier scroll
        // (chargement d'image, re-render React, animation smooth en cours) : on recale.
        scrollTimers = [setTimeout(apply, 150), setTimeout(apply, 400), setTimeout(apply, 700)];
      }

      function getDecapListItemIndex(node) {
        var el = node;
        while (el && el !== document.body) {
          var cls = String(el.className || '');
          if (/ListItem|list-item|NestedObject/i.test(cls)) {
            var parent = el.parentElement;
            if (!parent) return null;
            var items = Array.prototype.filter.call(parent.children, function(c) {
              return /ListItem|list-item|NestedObject/i.test(String(c.className || ''));
            });
            var idx = items.indexOf(el);
            return idx >= 0 ? idx : null;
          }
          el = el.parentElement;
        }
        return null;
      }

      function resolveAnchorFromEvent(e) {
        var node = e.target;
        if (!node || !node.closest) return null;
        if (node.closest('iframe')) return null;
        if (node.closest('[class*="PreviewPane"]') || node.closest('[class*="preview-pane"]')) return null;

        var tagged = node.closest('[data-preview-target]');
        var anchor = tagged ? tagged.getAttribute('data-preview-target') : null;

        if (!anchor) {
          var header = node.closest('[data-section-header="true"]');
          if (header) anchor = header.getAttribute('data-preview-target');
        }

        if (!anchor) {
          var control = node.closest('[class*="ControlContainer"]');
          if (control) {
            var labelEl = control.querySelector('label');
            anchor = matchLabelToPreviewTarget(labelEl ? labelEl.textContent : '');
          }
        }

        if (!anchor) return null;

        var indexable = {
          'preview-sidebar-small': true,
          'preview-bottom': true,
          'preview-asym-left': true,
          'preview-cat-politique': true,
          'preview-cat-culture': true,
          'preview-cat-societe': true,
          'preview-cat-technologie': true
        };
        if (indexable[anchor]) {
          var idx = getDecapListItemIndex(node);
          if (idx != null) anchor = anchor + '-' + idx;
        }
        return anchor;
      }

      function clearPreviewFlash(doc) {
        if (!doc) return;
        var flashes = doc.querySelectorAll('.preview-flash');
        for (var i = 0; i < flashes.length; i++) flashes[i].classList.remove('preview-flash');
      }

      function flashPreview(anchor, attempt) {
        if (!anchor || !isSettingsEditor()) return;
        var doc = getPreviewDocument();
        if (!doc) {
          if ((attempt || 0) < 15) {
            setTimeout(function() { flashPreview(anchor, (attempt || 0) + 1); }, 120);
          }
          return;
        }
        var el = doc.querySelector('[data-preview-anchor="' + anchor + '"]');
        if (!el && /-\d+$/.test(anchor)) {
          el = doc.querySelector('[data-preview-anchor="' + anchor.replace(/-\d+$/, '') + '"]');
        }
        if (!el) {
          if ((attempt || 0) < 15) {
            setTimeout(function() { flashPreview(anchor, (attempt || 0) + 1); }, 120);
          }
          return;
        }
        clearPreviewFlash(doc);
        el.classList.add('preview-flash');
        lastAnchor = anchor;
        scrollToPreviewEl(el, doc);
      }

      function onEditorLocate(e) {
        if (!isSettingsEditor()) return;
        var anchor = resolveAnchorFromEvent(e);
        if (!anchor) return;
        clearTimeout(hideTimer);
        clearTimeout(showTimer);
        showTimer = setTimeout(function() { flashPreview(anchor); }, 40);
      }

      // Point d'entrée pour le bouton « 📍 Aller à l'aperçu » posé sur chaque
      // en-tête de section (widget separator) : déclenchement direct au clic,
      // sans dépendre de la détection de survol.
      window.__sonarGoToPreview = flashPreview;

      document.addEventListener('mouseover', onEditorLocate, true);
      document.addEventListener('focusin', onEditorLocate, true);
      document.addEventListener('click', function(e) {
        if (!isSettingsEditor()) return;
        if (!e.target || !e.target.closest) return;
        if (!e.target.closest('[data-preview-target], [data-section-header="true"]')) return;
        var anchor = resolveAnchorFromEvent(e);
        if (!anchor) return;
        clearTimeout(hideTimer);
        flashPreview(anchor);
      }, true);

      document.addEventListener('mouseout', function(e) {
        if (!isSettingsEditor()) return;
        var related = e.relatedTarget;
        if (related && related.closest && related.closest('[data-preview-target], [data-section-header="true"], [class*="ControlContainer"]')) {
          return;
        }
        hideTimer = setTimeout(function() {
          lastAnchor = null;
          clearPreviewFlash(getPreviewDocument());
        }, 1200);
      }, true);
    })();

    // 🏷️ SCRIPT : RÉSUMÉS DE LISTE LISIBLES
    // Les widgets "list" de Decap affichent, une fois l'élément replié, un résumé
    // basé sur la valeur brute stockée pour les champs "relation" — c'est-à-dire
    // le slug du fichier markdown (ex: "test-admin"), pas le vrai titre de
    // l'article. On remplace ce texte par le titre réel (récupéré depuis le
    // store interne de Decap déjà utilisé pour les aperçus), avec un repli
    // "joli" (tirets → espaces, majuscules) si l'article n'est pas encore chargé.
    // On en profite pour transformer le résumé des listes "Styles" (marqué
    // "__STYLE_SUMMARY__" dans config.yml) en "Style : <nom de l'article>",
    // en retrouvant l'article au même index dans la liste voisine (même
    // data-preview-target), et pour masquer les boutons "Add ..." devenus
    // inutiles une fois les emplacements configurés.
    (function beautifyRelationSummaries() {
      var ARTICLE_SUMMARY_PATTERN = /^(Article\s*:\s*)(.+)$/;
      var STYLE_MARKER = '__STYLE_SUMMARY__';

      // Masquage Add / croix : uniquement Configuration Accueil.
      // Sur Catégories, on laisse ajouter et retirer les emplacements.
      function isHomepageEditor() {
        return /\/collections\/settings\/entries\/homepage(\/|$|\?)/.test(window.location.hash || '');
      }

      function isSettingsRoute() {
        return /\/collections\/settings\/entries\/(homepage|categories)(\/|$|\?)/.test(window.location.hash || '');
      }

      // Capitalise la première lettre de chaque mot sans passer par \b (qui gère
      // mal les lettres accentuées et produisait des majuscules aléatoires,
      // ex: "catégorie" → "catéGorie").
      function humanizeSlug(slug) {
        var cleaned = String(slug || '').replace(/\.mdx?$/, '').replace(/[-_]+/g, ' ').trim();
        if (!cleaned) return slug;
        return cleaned.split(' ').map(function(word) {
          return word ? word.charAt(0).toUpperCase() + word.slice(1) : word;
        }).join(' ');
      }

      function collectTextNodes(root, filterFn) {
        var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
        var out = [];
        var node;
        while ((node = walker.nextNode())) {
          if (!node.nodeValue) continue;
          var trimmed = node.nodeValue.trim();
          if (!trimmed) continue;
          if (filterFn(trimmed, node)) out.push(node);
        }
        return out;
      }

      function beautifyArticleSummaries() {
        var nodes = collectTextNodes(document.body, function(trimmed) {
          return ARTICLE_SUMMARY_PATTERN.test(trimmed);
        });
        nodes.forEach(function(node) {
          var m = ARTICLE_SUMMARY_PATTERN.exec(node.nodeValue.trim());
          var rawSlug = m[2].trim();
          if (node.__sonarResolvedSlug === rawSlug) return;
          var data = lookupFromCmsStore(rawSlug);
          var title = data && typeof data.title === 'string' && data.title.trim() ? data.title.trim() : null;
          var display = title || humanizeSlug(rawSlug);
          var nextText = m[1] + display;
          node.__sonarResolvedSlug = rawSlug;
          if (node.nodeValue !== nextText) node.nodeValue = nextText;
        });
      }

      function beautifyStyleSummaries() {
        var markerNodes = collectTextNodes(document.body, function(trimmed) {
          return trimmed === STYLE_MARKER;
        });
        if (!markerNodes.length) return;

        var byContainer = new Map();
        markerNodes.forEach(function(node) {
          var container = node.parentElement && node.parentElement.closest('[data-preview-target]');
          if (!container) return;
          if (!byContainer.has(container)) byContainer.set(container, []);
          byContainer.get(container).push(node);
        });

        byContainer.forEach(function(nodes, stylesContainer) {
          var target = stylesContainer.getAttribute('data-preview-target');
          if (!target) return;
          var candidates = document.querySelectorAll('[data-preview-target="' + target + '"]');
          var articleTitles = [];
          for (var i = 0; i < candidates.length; i++) {
            var cand = candidates[i];
            if (cand === stylesContainer) continue;
            var titles = collectTextNodes(cand, function(trimmed) {
              return ARTICLE_SUMMARY_PATTERN.test(trimmed);
            }).map(function(n) { return ARTICLE_SUMMARY_PATTERN.exec(n.nodeValue.trim())[2].trim(); });
            if (titles.length > 0) {
              articleTitles = titles;
              break;
            }
          }
          nodes.forEach(function(styleNode, index) {
            var title = articleTitles[index];
            var nextText = title ? ('Style : ' + title) : 'Style : Emplacement vide';
            if (styleNode.nodeValue !== nextText) styleNode.nodeValue = nextText;
          });
        });
      }

      function hideAddButtons() {
        var buttons = document.querySelectorAll('#nc-root button');
        for (var i = 0; i < buttons.length; i++) {
          var btn = buttons[i];
          var text = (btn.textContent || '').trim();
          if (/^Add\s+/i.test(text) && btn.style.display !== 'none') {
            btn.style.display = 'none';
          }
        }
      }

      function hideRemoveButtons() {
        // Dans la barre d'un item de liste, l'ordre des enfants est :
        // [bouton chevron (collapse), poignée de glisser-déposer (div, pas un bouton), bouton croix (remove)].
        // Le bouton croix est donc toujours le dernier <button> enfant direct de la barre.
        var bars = document.querySelectorAll('div[class*="StyledListItemTopBar"]');
        for (var i = 0; i < bars.length; i++) {
          var directButtons = bars[i].querySelectorAll(':scope > button');
          if (!directButtons.length) continue;
          var removeBtn = directButtons[directButtons.length - 1];
          if (removeBtn.style.display !== 'none') {
            removeBtn.style.display = 'none';
          }
        }
      }

      function beautify() {
        if (!isSettingsRoute()) return;
        beautifyArticleSummaries();
        beautifyStyleSummaries();
        if (!isHomepageEditor()) return;
        hideRemoveButtons();
        hideAddButtons();
      }

      var scheduled = false;
      function scheduleBeautify() {
        if (scheduled) return;
        scheduled = true;
        setTimeout(function() {
          scheduled = false;
          beautify();
        }, 60);
      }

      new MutationObserver(scheduleBeautify).observe(document.body, {
        childList: true,
        subtree: true,
        characterData: true
      });
      window.addEventListener('load', scheduleBeautify);
      scheduleBeautify();
    })();

    // 📂 SCRIPT : ORGANISATEUR / ACCORDÉON DE SIDEBAR
    // Configure ici la hiérarchie de tes collections (nom unique du name dans config.yml)
    window.addEventListener('load', () => {
      const waitAndOrganize = () => {
        if (!window.__SONAR_CMS_BOOTED) {
          setTimeout(waitAndOrganize, 120);
          return;
        }
      const SIDEBAR_GROUPS = [
        {
          title: "Création d'articles",
          collections: ["articles", "breves", "revues_musicales"]
        },
        {
          title: "Catégories",
          collections: (window.__SONAR_DOMAINS || []).length
            ? (window.__SONAR_DOMAINS || []).map(function(domain) {
                return window.SonarDomainCollectionName
                  ? window.SonarDomainCollectionName(domain.slug)
                  : ('articles_' + String(domain.slug || '').replace(/[^a-z0-9]+/gi, '_'));
              })
            : ["articles_politique", "articles_culture", "articles_societe", "articles_technologie"]
        },
        {
          title: "Filtres & Statuts",
          collections: ["contenus_visibles", "contenus_masques"]
        },
        {
          title: "Paramètres",
          collections: ["settings", "domains"]
        }
      ];

      function addModerationNav(sidebarContainer) {
        if (sidebarContainer.querySelector('#cms-moderation-group')) return;

        const header = document.createElement('div');
        header.id = 'cms-moderation-group';
        header.className = 'cms-sidebar-header';
        header.style.cssText = `
          cursor: pointer;
          font-weight: bold;
          font-size: 0.85rem;
          text-transform: uppercase;
          letter-spacing: 0.5px;
          background: #01002b;
          color: #ffffff;
          padding: 10px 14px;
          margin-top: 8px;
          border-radius: 6px;
          display: flex;
          justify-content: space-between;
          align-items: center;
          user-select: none;
        `;
        header.innerHTML = '<span>Modération</span><span class="arrow" style="font-size: 0.7rem;">▼</span>';

        function makeItem(id, label, view, extraHtml) {
          const item = document.createElement('button');
          item.type = 'button';
          item.id = id;
          item.className = 'cms-moderation-item';
          item.style.paddingLeft = '10px';
          item.innerHTML = '<span>' + label + '</span>' + (extraHtml || '');
          item.addEventListener('click', (event) => {
            event.preventDefault();
            if (window.SonarModeration) window.SonarModeration.open(view);
          });
          return item;
        }

        const reported = makeItem('cms-moderation-nav', 'Commentaires signalés', 'reports', '<span id="cms-moderation-badge" hidden>0</span>');
        const published = makeItem('cms-moderation-published', 'Commentaires publiés', 'published', '');

        let isCollapsed = false;
        header.addEventListener('click', () => {
          isCollapsed = !isCollapsed;
          const arrow = header.querySelector('.arrow');
          if (arrow) arrow.textContent = isCollapsed ? '►' : '▼';
          reported.style.display = isCollapsed ? 'none' : 'flex';
          published.style.display = isCollapsed ? 'none' : 'flex';
        });

        sidebarContainer.appendChild(header);
        sidebarContainer.appendChild(reported);
        sidebarContainer.appendChild(published);
        if (window.SonarModeration && window.SonarModeration.refresh) {
          window.SonarModeration.refresh();
        }
      }

      function collectionPath(slug) {
        const name = window.SonarDomainCollectionName
          ? window.SonarDomainCollectionName(slug)
          : ('articles_' + String(slug || '').replace(/[^a-z0-9]+/gi, '_'));
        return '/collections/' + name;
      }

      function findSidebarItem(sidebarLinks, slug) {
        const needle = collectionPath(slug);
        const link = sidebarLinks.find(a => {
          const href = a.getAttribute('href') || '';
          const idx = href.indexOf(needle);
          if (idx === -1) return false;
          const after = href.charAt(idx + needle.length);
          return after === '' || after === '/' || after === '?' || after === '#';
        });
        return link ? (link.closest('li') || link) : null;
      }

      function categoryTree() {
        const mains = Array.isArray(window.__SONAR_MAIN_DOMAINS) ? window.__SONAR_MAIN_DOMAINS : [];
        const subs = Array.isArray(window.__SONAR_SUBDOMAINS) ? window.__SONAR_SUBDOMAINS : [];
        if (mains.length) return { mains: mains, subs: subs };
        const flat = Array.isArray(window.__SONAR_DOMAINS) ? window.__SONAR_DOMAINS : [];
        return {
          mains: flat.filter(d => d && d.slug && !d.parent),
          subs: flat.filter(d => d && d.parent)
        };
      }

      function nestCategorySubdomains(sidebarContainer) {
        const tree = categoryTree();
        if (!tree.mains.length || !tree.subs.length) return;
        const sidebarLinks = Array.from(sidebarContainer.querySelectorAll('a'));
        const current = String(window.location.hash || window.location.pathname || '');

        tree.mains.forEach(main => {
          if (!main || !main.slug) return;
          const children = tree.subs.filter(s => s && s.parent === main.slug && s.slug);
          if (!children.length) return;
          const parentEl = findSidebarItem(sidebarLinks, main.slug);
          if (!parentEl || parentEl.tagName === 'A' || parentEl.getAttribute('data-cms-nested') === 'true') return;

          const wrap = document.createElement('ul');
          wrap.className = 'cms-cat-subs';
          wrap.style.cssText = 'display:none;list-style:none;margin:0;padding:0;width:100%;';

          let anyChild = false;
          let shouldOpen = current.indexOf(collectionPath(main.slug)) !== -1;
          children.forEach(sub => {
            const childEl = findSidebarItem(sidebarLinks, sub.slug);
            if (!childEl || childEl === parentEl) return;
            const a = childEl.querySelector('a') || (childEl.tagName === 'A' ? childEl : null);
            if (a && sub.label) a.textContent = sub.label;
            childEl.style.paddingLeft = '18px';
            wrap.appendChild(childEl);
            anyChild = true;
            if (current.indexOf(collectionPath(sub.slug)) !== -1) shouldOpen = true;
          });
          if (!anyChild) return;

          const parentLink = parentEl.querySelector('a');
          if (parentLink) {
            parentLink.style.paddingRight = '36px';
            parentLink.style.pointerEvents = 'auto';
            parentLink.style.position = 'relative';
            parentLink.style.zIndex = '2';
            parentLink.style.cursor = 'pointer';
            parentLink.addEventListener('click', function (event) {
              if (event.metaKey || event.ctrlKey || event.shiftKey || event.altKey || event.button !== 0) return;
              var href = parentLink.getAttribute('href') || '';
              if (!href) return;
              event.preventDefault();
              event.stopPropagation();
              var hashIdx = href.indexOf('#');
              var next = hashIdx === -1 ? href : href.slice(hashIdx + 1);
              next = String(next || '').replace(/^#/, '');
              if (next && next.charAt(0) !== '/') next = '/' + next;
              if (!next) return;
              if ((window.location.hash || '').replace(/^#/, '') !== next.replace(/^#/, '')) {
                window.location.hash = next;
              }
            });
          }

          const toggle = document.createElement('button');
          toggle.type = 'button';
          toggle.className = 'cms-cat-toggle';
          toggle.setAttribute('aria-expanded', shouldOpen ? 'true' : 'false');
          toggle.setAttribute('aria-label', 'Sous-domaines de ' + (main.label || main.slug));
          toggle.style.cssText = [
            'position:absolute',
            'right:4px',
            'top:0',
            'width:28px',
            'height:36px',
            'margin:0',
            'padding:0',
            'border:none',
            'background:transparent',
            'color:#ff8826',
            'cursor:pointer',
            'z-index:3',
            'display:inline-flex',
            'align-items:center',
            'justify-content:center',
            'transform:' + (shouldOpen ? 'rotate(0deg)' : 'rotate(-90deg)'),
            'transition:transform 0.15s ease'
          ].join(';');
          toggle.innerHTML = '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"></polyline></svg>';

          parentEl.style.position = 'relative';
          parentEl.style.overflow = 'visible';
          parentEl.appendChild(toggle);
          parentEl.appendChild(wrap);
          parentEl.setAttribute('data-cms-nested', 'true');

          if (shouldOpen) wrap.style.display = 'block';

          wrap.addEventListener('click', (event) => {
            event.stopPropagation();
          });
          toggle.addEventListener('click', (event) => {
            event.preventDefault();
            event.stopPropagation();
            const open = wrap.style.display === 'none';
            wrap.style.display = open ? 'block' : 'none';
            toggle.style.transform = open ? 'rotate(0deg)' : 'rotate(-90deg)';
            toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
          });
        });
      }

      function organizeSidebar() {
        // 1. Cible spécifiquement la sidebar de Decap CMS pour éviter les liens d'en-tête d'édition
        // Decap entoure sa sidebar dans un élément <aside> ou un conteneur principal de navigation
        const sidebarContainer = document.querySelector('aside') || document.querySelector('[class*="Sidebar"]') || document.querySelector('[class*="sidebar"]');
        
        if (!sidebarContainer) return;

        // On ne récupère que les liens <a> situés À L'INTÉRIEUR de la sidebar
        const sidebarLinks = Array.from(sidebarContainer.querySelectorAll('a'));

        if (!sidebarContainer.querySelector('[data-cms-group]') && sidebarLinks.length > 0) {
        SIDEBAR_GROUPS.forEach(group => {
          const itemsToGroup = [];

          group.collections.forEach(colName => {
            const link = sidebarLinks.find(a => {
              const href = a.getAttribute('href') || '';
              const needle = '/collections/' + colName;
              const idx = href.indexOf(needle);
              if (idx === -1) return false;
              const after = href.charAt(idx + needle.length);
              return after === '' || after === '/' || after === '?' || after === '#';
            });

            if (link) {
              const parentEl = link.closest('li') || link;
              itemsToGroup.push(parentEl);
            }
          });

          if (itemsToGroup.length > 0) {
            const header = document.createElement('div');
            header.className = 'cms-sidebar-header';
            header.setAttribute('data-cms-group', group.title);
            header.style.cssText = `
              cursor: pointer;
              font-weight: bold;
              font-size: 0.85rem;
              text-transform: uppercase;
              letter-spacing: 0.5px;
              background: #01002b;
              color: #ffffff;
              padding: 10px 14px;
              margin-top: 8px;
              border-radius: 6px;
              display: flex;
              justify-content: space-between;
              align-items: center;
              user-select: none;
            `;
            header.innerHTML = `<span>${group.title}</span><span class="arrow" style="font-size: 0.7rem;">▼</span>`;

            let isCollapsed = false;

            const parentNode = itemsToGroup[0].parentNode;
            parentNode.insertBefore(header, itemsToGroup[0]);
            let cursor = header;
            itemsToGroup.forEach(el => {
              parentNode.insertBefore(el, cursor.nextSibling);
              cursor = el;
              el.style.paddingLeft = '10px';
            });

            header.addEventListener('click', () => {
              isCollapsed = !isCollapsed;
              header.querySelector('.arrow').innerText = isCollapsed ? '►' : '▼';

              itemsToGroup.forEach(el => {
                if (el.closest && el.closest('.cms-cat-subs')) return;
                el.style.display = isCollapsed ? 'none' : '';
                el.style.paddingLeft = isCollapsed ? '0px' : '10px';
              });
            });
          }
        });
        }

        nestCategorySubdomains(sidebarContainer);
        addModerationNav(sidebarContainer);
      }

      // Observer les changements dans le DOM sans cibler l'en-tête de page
      const observer = new MutationObserver(() => {
        organizeSidebar();
      });

      observer.observe(document.body, {
        childList: true,
        subtree: true
      });

      organizeSidebar();
      };
      waitAndOrganize();
    });
    if (window.SonarCmsBoot) window.SonarCmsBoot();
  </script>
</body>
