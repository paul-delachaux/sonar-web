local_backend: true
backend:
  name: github
  repo: paul-delachaux/sonar-web 
  branch: main
  base_url: https://sonar-oauth-media.vercel.app
  auth_endpoint: auth
publish_mode: editorial_workflow  
media_folder: "public/assets/uploads"
public_folder: "/assets/uploads"

collections:
  # ==========================================
  # 1. COLLECTION : ARTICLES (Création / Édition)
  # ==========================================
  - name: "articles"
    label: "Articles"
    folder: "src/content/articles"
    create: true
    slug: "{{slug}}"
    filter: { field: "layout_type", pattern: "^(?!breve$).*" }
    fields:
      # --- VERSION FRANÇAISE ---
      - { name: "version_fr_sep", widget: "separator", label: "🇫🇷 Version Française", collapsed: false, required: false }
      - { name: "title", label: "Titre (FR)", widget: "string" }
      - { name: "description", label: "Description (FR)", widget: "string" }
      - { name: "body", label: "Contenu de l'article (FR)", widget: "markdown" }

      # --- VERSION ANGLAISE (FACULTATIVE) ---
      - { name: "version_en_sep", widget: "separator", label: "🇬🇧 Version Anglaise (Optionnelle)", collapsed: false, required: false }
      - { name: "title_en", label: "Titre (EN)", widget: "string", required: false }
      - { name: "description_en", label: "Description (EN)", widget: "string", required: false }
      - { name: "body_en", label: "Contenu de l'article (EN)", widget: "markdown", required: false }

      # --- MOTS DÉFINIS (SURVOL) ---
      - { name: "definitions_sep", widget: "separator", label: "📖 Mots définis (survol orange)", required: false }
      - label: "Définitions"
        name: "definitions"
        widget: "list"
        required: false
        summary: "{{fields.term}}{{fields.term_en}}"
        hint: "Remplis le français, l'anglais, ou les deux. Un mot uniquement anglais fonctionne aussi dans le texte FR."
        fields:
          - { label: "Mot ou expression (FR)", name: "term", widget: "string", required: false }
          - { label: "Définition (FR)", name: "definition", widget: "text", required: false }
          - { label: "Mot ou expression (EN)", name: "term_en", widget: "string", required: false }
          - { label: "Définition (EN)", name: "definition_en", widget: "text", required: false }

      # --- INFORMATIONS GÉNÉRALES ---
      - { label: "INFORMATIONS GÉNÉRALES DE L'ARTICLE", name: "sep_article", widget: "separator", required: false }
      - { label: "Date de publication", name: "date", widget: "datetime" }
      - label: "Catégorie"
        name: "category"
        widget: "relation"
        collection: "domains"
        file: "domains"
        search_fields: ["domains.*.label", "domains.*.slug"]
        value_field: "domains.*.slug"
        display_fields: ["domains.*.label"]
        options_length: 50
        hint: "Domaines et sous-domaines (Paramètres → Domaines). Un article de sous-domaine apparaît aussi sur la page du domaine principal."
      
      # --- IMAGES ---
      - { label: "Image de miniature", name: "image", widget: "image", hint: "Sert de miniature globale et d'image d'article par défaut" }
      - label: "Légende de l'image (Optionnelle)"
        name: "image_info"
        widget: "list"
        required: false
        min: 1
        default:
          - image_caption: ""
            image_caption_en: ""
        collapsed: false
        fields:
          - { name: "image_caption", label: "Légende de l'image (FR)", widget: "string", required: false }
          - { name: "image_caption_en", label: "Légende de l'image (EN)", widget: "string", required: false }
      - { label: "Image interne de l'article (Optionnelle)", name: "article_image", widget: "image", required: false, hint: "Si laissée vide, l'image de miniature sera utilisée" }
      - { label: "Position de l'image (après le paragraphe N)", name: "image_position", widget: "number", default: 0, min: 0, required: false, hint: "0 = l'image apparaît au-dessus de tout le texte. 1, 2, 3... = elle apparaît après ce paragraphe." }

      - { label: "Visible sur le site ?", name: "isVisible", widget: "boolean", default: true, required: false }

      # --- INFOS AUTEUR & LECTURE ---
      - label: "Auteur de l'article"
        name: "author"
        widget: "select"
        options:
          - { label: "Victor Zhâ", value: "Victor Zhâ" }
          - { label: "Paul Delachaux", value: "Paul Delachaux" }
      - label: "Informations sur l'auteur"
        name: "author_info"
        widget: "list"
        required: false
        collapsed: false
        max : 1
        fields:
          - { label: "À propos de l'auteur (FR)", name: "author_about", widget: "text", default: "Aucune information fournie pour le moment.", required: false }
          - { label: "À propos de l'auteur (EN)", name: "author_about_en", widget: "text", default: "No information provided at this time.", required: false }
          - { label: "Déclaration d'intérêt (FR)", name: "author_interests", widget: "text", required: false }
          - { label: "Déclaration d'intérêt (EN)", name: "author_interests_en", widget: "text", required: false }
          - { label: "Partenaires (FR)", name: "author_partners", widget: "text", required: false }
          - { label: "Partenaires (EN)", name: "author_partners_en", widget: "text", required: false }
      
      - { label: "Temps de lecture (minutes)", name: "reading_time", widget: "number", default: 5, value_type: "int" }
      
      - label: "Sources consultables"
        name: "consulted_sources"
        widget: "list"
        summary: "{{fields.source_title}}"
        required: false
        fields:
          - { label: "Nom de la source (FR)", name: "source_title", widget: "string" }
          - { label: "Nom de la source (EN)", name: "source_title_en", widget: "string" }
          - { label: "Lien URL (Optionnel)", name: "source_url", widget: "string", required: false }

      - { label: "Tweet à intégrer (Optionnel)", name: "tweet_url", widget: "string", required: false, hint: "Colle l'URL complète du tweet, ex: https://x.com/nom_utilisateur/status/123456789" }
      - { label: "Position du tweet (après le paragraphe N)", name: "tweet_position", widget: "number", default: 0, min: 0, required: false, hint: "0 = le tweet apparaît au-dessus de tout le texte. 1, 2, 3... = il apparaît après ce paragraphe." }

      # --- MINIATURE CUSTOM ---
      - { label: "CONFIGURATION GRAPHIQUE DE LA MINIATURE (optionnel)", name: "sep_miniature", widget: "separator", required: false, collapsed: true }
      - { label: "Image Fond Miniature", name: "thumbnail_bg", widget: "image", required: false, title: "Partie Miniature (optionnel)" }

      - label: "Aperçu et textes de la miniature (glisser-déposer)"
        name: "thumbnail_layout"
        widget: "thumbnail-editor"
        required: false
        hint: "Choisis le cadre (à la une, sidebar, ou largeur/hauteur perso). Ajoute une ou plusieurs images, déplace-les et redimensionne-les avec les poignées. Ajoute des blocs de texte par-dessus."

      - { label: "Utiliser la miniature custom ?", name: "use_thumbnail", widget: "boolean", default: false, required: false }

  # ==========================================
  # 2. COLLECTION : BRÈVES (Création / Édition)
  # ==========================================
  - name: "breves"
    label: "Brèves"
    label_singular: "Brève"
    folder: "src/content/articles"
    create: true
    slug: "{{slug}}"
    filter: { field: "layout_type", value: "breve" }
    fields:
      - { name: "layout_type", widget: "hidden", default: "breve" }
      # --- VERSION FRANCAISE ---
      - { name: "version_fr_sep", widget: "separator", label: "🇫🇷 Version Française", collapsed: false, required: false }
      - { name: "title", label: "Titre de la brève (FR)", widget: "string" }
      - { name: "description", label: "Description (FR)", widget: "string" }
      - { name: "body", label: "Texte court", widget: "markdown" }

      # --- VERSION ANGLAISE (FACULTATIVE) ---
      - { name: "version_en_sep", widget: "separator", label: "🇬🇧 Version Anglaise (Optionnelle)", collapsed: false, required: false }
      - { name: "title_en", label: "Titre de la brève (EN)", widget: "string", required: false }
      - { name: "description_en", label: "Description (EN)", widget: "string", required: false }
      - { name: "body_en", label: "Texte court", widget: "markdown", required: false }

      # --- MOTS DÉFINIS (SURVOL) ---
      - { name: "definitions_sep", widget: "separator", label: "📖 Mots définis (survol orange)", required: false }
      - label: "Définitions"
        name: "definitions"
        widget: "list"
        required: false
        summary: "{{fields.term}}{{fields.term_en}}"
        hint: "Remplis le français, l'anglais, ou les deux. Un mot uniquement anglais fonctionne aussi dans le texte FR."
        fields:
          - { label: "Mot ou expression (FR)", name: "term", widget: "string", required: false }
          - { label: "Définition (FR)", name: "definition", widget: "text", required: false }
          - { label: "Mot ou expression (EN)", name: "term_en", widget: "string", required: false }
          - { label: "Définition (EN)", name: "definition_en", widget: "text", required: false }

      - { label: "INFORMATIONS GÉNÉRALES DE L'ARTICLE", name: "sep_article", widget: "separator", required: false }
      - { label: "Date de publication", name: "date", widget: "datetime" }
      - label: "Auteur de l'article"
        name: "author"
        widget: "select"
        options:
          - { label: "Victor Zhâ", value: "Victor Zhâ" }
          - { label: "Paul Delachaux", value: "Paul Delachaux" }

      - label: "Informations sur l'auteur"
        name: "author_info"
        widget: "list"
        required: false
        collapsed: false
        max : 1
        fields:
          - { label: "À propos de l'auteur (FR)", name: "author_about", widget: "text", default: "Aucune information fournie pour le moment.", required: false }
          - { label: "À propos de l'auteur (EN)", name: "author_about_en", widget: "text", default: "No information provided at this time.", required: false }
          - { label: "Déclaration d'intérêt (FR)", name: "author_interests", widget: "text", required: false }
          - { label: "Déclaration d'intérêt (EN)", name: "author_interests_en", widget: "text", required: false }
          - { label: "Partenaires (FR)", name: "author_partners", widget: "text", required: false }
          - { label: "Partenaires (EN)", name: "author_partners_en", widget: "text", required: false }

      - label: "Catégorie"
        name: "category"
        widget: "relation"
        collection: "domains"
        file: "domains"
        search_fields: ["domains.*.label", "domains.*.slug"]
        value_field: "domains.*.slug"
        display_fields: ["domains.*.label"]
        options_length: 50
        hint: "Domaines et sous-domaines (Paramètres → Domaines). Un article de sous-domaine apparaît aussi sur la page du domaine principal."
      - { label: "Image de miniature", name: "image", widget: "image" }
      - label: "Légende de l'image (Optionnelle)"
        name: "image_info"
        widget: "list"
        required: false
        min: 1
        default:
          - image_caption: ""
            image_caption_en: ""
        collapsed: false
        fields:
          - { name: "image_caption", label: "Légende de l'image (FR)", widget: "string", required: false }
          - { name: "image_caption_en", label: "Légende de l'image (EN)", widget: "string", required: false }

      - { label: "Position de l'image (après le paragraphe N)", name: "image_position", widget: "number", default: 0, min: 0, required: false, hint: "0 = l'image apparaît au-dessus de tout le texte. 1, 2, 3... = elle apparaît après ce paragraphe." }
      - { label: "Visible sur le site ?", name: "isVisible", widget: "boolean", default: true, required: false }

      - label: "Sources consultables"
        name: "consulted_sources"
        widget: "list"
        summary: "{{fields.source_title}}"
        required: false
        fields:
          - { label: "Nom de la source (FR)", name: "source_title", widget: "string" }
          - { label: "Nom de la source (EN)", name: "source_title_en", widget: "string", required: false }
          - { label: "Lien URL (Optionnel)", name: "source_url", widget: "string", required: false }

      # --- MINIATURE CUSTOM ---
      - { label: "CONFIGURATION GRAPHIQUE DE LA MINIATURE (optionnel)", name: "sep_miniature", widget: "separator", required: false, collapsed: true }
      - { label: "Image Fond Miniature", name: "thumbnail_bg", widget: "image", required: false, title: "Partie Miniature (optionnel)" }

      - label: "Aperçu et textes de la miniature (glisser-déposer)"
        name: "thumbnail_layout"
        widget: "thumbnail-editor"
        required: false
        hint: "Choisis le cadre (à la une, sidebar, ou largeur/hauteur perso). Ajoute une ou plusieurs images, déplace-les et redimensionne-les avec les poignées. Ajoute des blocs de texte par-dessus."

      - { label: "Utiliser la miniature custom ?", name: "use_thumbnail", widget: "boolean", default: false, required: false }

  # ==========================================
  # 2b. COLLECTION : REVUES MUSICALES
  # ==========================================
  - name: "revues_musicales"
    label: "Revues musicales"
    label_singular: "Revue musicale"
    folder: "src/content/articles"
    create: true
    slug: "{{slug}}"
    filter: { field: "layout_type", value: "revue_musicale" }
    fields:
      - { name: "layout_type", widget: "hidden", default: "revue_musicale" }
      - { name: "category", widget: "hidden", default: "revue-musicale" }

      - { name: "version_fr_sep", widget: "separator", label: "🇫🇷 Version Française", collapsed: false, required: false }
      - { name: "title", label: "Titre (FR)", widget: "string" }
      - { name: "description", label: "Description (FR)", widget: "text" }

      - { name: "version_en_sep", widget: "separator", label: "🇬🇧 Version Anglaise (Optionnelle)", collapsed: false, required: false }
      - { name: "title_en", label: "Titre (EN)", widget: "string", required: false }
      - { name: "description_en", label: "Description (EN)", widget: "text", required: false }

      - { label: "LIGNES DU LAYOUT (2 blocs par ligne)", name: "sep_rows", widget: "separator", required: false }
      - label: "Lignes"
        name: "revue_rows"
        widget: "list"
        label_singular: "Ligne"
        summary: "{{left.type}} · {{right.type}}"
        required: false
        hint: "Chaque ligne a deux blocs. Pour chacun, choisis Texte, Image ou Audio. Tu peux mettre du texte des deux côtés."
        fields:
          - label: "Bloc gauche"
            name: "left"
            widget: "object"
            collapsed: false
            fields:
              - label: "Type de bloc"
                name: "type"
                widget: "select"
                default: "texte"
                options:
                  - { label: "Texte", value: "texte" }
                  - { label: "Image", value: "image" }
                  - { label: "Audio", value: "audio" }
              - { label: "Texte (FR)", name: "text", widget: "markdown", required: false }
              - { label: "Texte (EN)", name: "text_en", widget: "markdown", required: false }
              - { label: "Image", name: "image", widget: "image", required: false }
              - label: "Pistes audio"
                name: "tracks"
                widget: "list"
                required: false
                summary: "{{title}} {{file}} {{url}}"
                hint: "Fichier mp3, ou URL YouTube / fichier audio en ligne."
                fields:
                  - { label: "Fichier audio (mp3)", name: "file", widget: "file", required: false, hint: "Upload d'un mp3/wav. Pour YouTube, utilise le champ URL ci-dessous." }
                  - { label: "URL YouTube ou audio", name: "url", widget: "string", required: false, hint: "Colle un lien YouTube (youtube.com/watch ou youtu.be) ou l'URL directe d'un mp3." }
                  - { label: "Titre (FR)", name: "title", widget: "string", required: false }
                  - { label: "Titre (EN)", name: "title_en", widget: "string", required: false }
          - label: "Bloc droit"
            name: "right"
            widget: "object"
            collapsed: false
            fields:
              - label: "Type de bloc"
                name: "type"
                widget: "select"
                default: "texte"
                options:
                  - { label: "Texte", value: "texte" }
                  - { label: "Image", value: "image" }
                  - { label: "Audio", value: "audio" }
              - { label: "Texte (FR)", name: "text", widget: "markdown", required: false }
              - { label: "Texte (EN)", name: "text_en", widget: "markdown", required: false }
              - { label: "Image", name: "image", widget: "image", required: false }
              - label: "Pistes audio"
                name: "tracks"
                widget: "list"
                required: false
                summary: "{{title}} {{file}} {{url}}"
                hint: "Fichier mp3, ou URL YouTube / fichier audio en ligne."
                fields:
                  - { label: "Fichier audio (mp3)", name: "file", widget: "file", required: false, hint: "Upload d'un mp3/wav. Pour YouTube, utilise le champ URL ci-dessous." }
                  - { label: "URL YouTube ou audio", name: "url", widget: "string", required: false, hint: "Colle un lien YouTube (youtube.com/watch ou youtu.be) ou l'URL directe d'un mp3." }
                  - { label: "Titre (FR)", name: "title", widget: "string", required: false }
                  - { label: "Titre (EN)", name: "title_en", widget: "string", required: false }

      - { label: "INFORMATIONS GÉNÉRALES", name: "sep_article", widget: "separator", required: false }
      - { label: "Date de publication", name: "date", widget: "datetime" }
      - label: "Auteur de l'article"
        name: "author"
        widget: "select"
        options:
          - { label: "Victor Zhâ", value: "Victor Zhâ" }
          - { label: "Paul Delachaux", value: "Paul Delachaux" }
      - label: "Informations sur l'auteur"
        name: "author_info"
        widget: "list"
        required: false
        collapsed: false
        max: 1
        fields:
          - { label: "À propos de l'auteur (FR)", name: "author_about", widget: "text", default: "Aucune information fournie pour le moment.", required: false }
          - { label: "À propos de l'auteur (EN)", name: "author_about_en", widget: "text", default: "No information provided at this time.", required: false }
          - { label: "Déclaration d'intérêt (FR)", name: "author_interests", widget: "text", required: false }
          - { label: "Déclaration d'intérêt (EN)", name: "author_interests_en", widget: "text", required: false }
          - { label: "Partenaires (FR)", name: "author_partners", widget: "text", required: false }
          - { label: "Partenaires (EN)", name: "author_partners_en", widget: "text", required: false }
      - { label: "Temps de lecture (minutes)", name: "reading_time", widget: "number", default: 5, value_type: "int" }
      - { label: "Visible sur le site ?", name: "isVisible", widget: "boolean", default: true, required: false }
      - { label: "Image de miniature", name: "image", widget: "image", hint: "Miniature d'accueil et de la page Culture" }
      - label: "Sources consultables"
        name: "consulted_sources"
        widget: "list"
        summary: "{{fields.source_title}}"
        required: false
        fields:
          - { label: "Nom de la source (FR)", name: "source_title", widget: "string" }
          - { label: "Nom de la source (EN)", name: "source_title_en", widget: "string", required: false }
          - { label: "Lien URL (Optionnel)", name: "source_url", widget: "string", required: false }

      - { label: "CONFIGURATION GRAPHIQUE DE LA MINIATURE (optionnel)", name: "sep_miniature", widget: "separator", required: false, collapsed: true }
      - { label: "Image Fond Miniature", name: "thumbnail_bg", widget: "image", required: false }
      - label: "Aperçu et textes de la miniature (glisser-déposer)"
        name: "thumbnail_layout"
        widget: "thumbnail-editor"
        required: false
      - { label: "Utiliser la miniature custom ?", name: "use_thumbnail", widget: "boolean", default: false, required: false }

  # ==========================================
  # 3. VUES FILTRÉES : ARTICLES PAR CATÉGORIE
  # ==========================================
  - name: "articles_politique"
    label: "Politique"
    folder: "src/content/articles"
    filter: { field: "category", value: "politique" }
    create: false
    fields:
      - { label: "Titre", name: "title", widget: "string" }
      - { label: "Visible sur le site ?", name: "isVisible", widget: "boolean", default: true, required: false }

  - name: "articles_culture"
    label: "Culture"
    folder: "src/content/articles"
    filter: { field: "category", value: "culture" }
    create: false
    fields:
      - { label: "Titre", name: "title", widget: "string" }
      - { label: "Visible sur le site ?", name: "isVisible", widget: "boolean", default: true, required: false }

  - name: "articles_societe"
    label: "Société"
    folder: "src/content/articles"
    filter: { field: "category", value: "societe" }
    create: false
    fields:
      - { label: "Titre", name: "title", widget: "string" }
      - { label: "Visible sur le site ?", name: "isVisible", widget: "boolean", default: true, required: false }

  - name: "articles_technologie"
    label: "Technologie"
    folder: "src/content/articles"
    filter: { field: "category", value: "technologie" }
    create: false
    fields:
      - { label: "Titre", name: "title", widget: "string" }
      - { label: "Visible sur le site ?", name: "isVisible", widget: "boolean", default: true, required: false }

  # ==========================================
  # 5. VUES FILTRÉES : PAR VISIBILITÉ
  # ==========================================
  - name: "contenus_visibles"
    label: "👁️ En ligne / Visibles"
    folder: "src/content/articles"
    filter: { field: "isVisible", value: true }
    create: false
    fields:
      - { label: "Titre", name: "title", widget: "string" }
      - { label: "Visible sur le site ?", name: "isVisible", widget: "boolean" }

  - name: "contenus_masques"
    label: "🚫 Masqués / Non visibles"
    folder: "src/content/articles"
    filter: { field: "isVisible", value: false }
    create: false
    fields:
      - { label: "Titre", name: "title", widget: "string" }
      - { label: "Visible sur le site ?", name: "isVisible", widget: "boolean" }

  # ==========================================
  # 6. PARAMÈTRES DU SITE
  # ==========================================
  - name: "settings"
    label: "Configuration"
    delete: false
    files:
      - name: "homepage"
        label: "Configuration Accueil"
        file: "src/data/settings.json"
        editor:
          preview: true
        fields:
          # --- ARTICLE A LA UNE ---
          - { label: "Article à la une", name: "sep_article_une", widget: "separator", required: false }
          - label: "Choisir l'article"
            name: "heroArticle"
            widget: "relation-filtered"
            collection: "contenus_visibles"
            search_fields: ["title"]
            value_field: "{{slug}}"
            display_fields: ["title"]

          # --- SECTION DROITE (HAUT - LONG) ---
          - { label: "Première sidebar", name: "sep_sidebar_long", widget: "separator", required: false }
          - label: "Premier article (format long)"
            name: "sidebarLongArticle"
            widget: "relation-filtered"
            collection: "contenus_visibles"
            search_fields: ["title"]
            value_field: "{{slug}}"
            display_fields: ["title"]
            required: false

          # --- SECTION DROITE (BAS - DEUX PETITS) ---
          - label: "Deux articles du bas"
            name: "sidebarSmallArticles"
            widget: "list"
            label_singular: "Article"
            summary: "Article : {{article}}"
            min: 0
            max: 2
            allow_duplicate: false
            required: false
            field:
              label: "Article"
              name: "article"
              widget: "relation-filtered"
              collection: "contenus_visibles"
              search_fields: ["title"]
              value_field: "{{slug}}"
              display_fields: ["title"]
              required: false

          # --- SECTION DU BAS (TROIS ARTICLES) ---
          - { label: "Deuxième sidebar", name: "sep_sidebar_mid", widget: "separator", required: false }
          - label: "Rangée du bas (max. 3)"
            name: "bottomArticles"
            widget: "list"
            label_singular: "Article"
            summary: "Article : {{article}}"
            min: 0
            max: 3
            allow_duplicate: false
            required: false
            field:
              label: "Article"
              name: "article"
              widget: "relation-filtered"
              collection: "contenus_visibles"
              search_fields: ["title"]
