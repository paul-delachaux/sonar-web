local_backend: true
backend:
  name: github
  repo: paul-delachaux/sonar-web 
  branch: main
  base_url: https://sonar-oauth-media.vercel.app
  auth_endpoint: auth
  allowed_users:
    - paul-delachaux
    - souslesonar-hash
publish_mode: editorial_workflow  
media_folder: "public/assets/uploads"
public_folder: "/assets/uploads"

collections:
  # ==========================================
  # 1. COLLECTION : ARTICLES (Création / Édition)
  # ==========================================
  - name: "articles"
    label: "Articles"
    folder: "src/content/articles"
    create: true
    slug: "{{slug}}"
    filter: { field: "layout_type", pattern: "^(?!breve$).*" }
    fields:
      # --- VERSION FRANÇAISE ---
      - { name: "version_fr_sep", widget: "separator", label: "🇫🇷 Version Française", collapsed: false, required: false }
      - { name: "title", label: "Titre (FR)", widget: "string" }
      - { name: "description", label: "Description (FR)", widget: "string" }
      - { name: "body", label: "Contenu de l'article (FR)", widget: "markdown" }

      # --- VERSION ANGLAISE (FACULTATIVE) ---
      - { name: "version_en_sep", widget: "separator", label: "🇬🇧 Version Anglaise (Optionnelle)", collapsed: false, required: false }
      - { name: "title_en", label: "Titre (EN)", widget: "string", required: false }
      - { name: "description_en", label: "Description (EN)", widget: "string", required: false }
      - { name: "body_en", label: "Contenu de l'article (EN)", widget: "markdown", required: false }

      # --- INFORMATIONS GÉNÉRALES ---
      - { label: "INFORMATIONS GÉNÉRALES DE L'ARTICLE", name: "sep_article", widget: "separator", required: false }
      - { label: "Date de publication", name: "date", widget: "datetime" }
      - { label: "Catégorie", name: "category", widget: "select", options: ["politique", "culture", "societe", "technologie"] }
      
      # --- IMAGES ---
      - { label: "Image de miniature", name: "image", widget: "image", hint: "Sert de miniature globale et d'image d'article par défaut" }
      - label: "Légende de l'image (Optionnelle)"
        name: "image_info"
        widget: "list"
        required: false
        min: 1
        default:
          - image_caption: ""
            image_caption_en: ""
        collapsed: false
        fields:
          - { name: "image_caption", label: "Légende de l'image (FR)", widget: "string", required: false }
          - { name: "image_caption_en", label: "Légende de l'image (EN)", widget: "string", required: false }
      - { label: "Image interne de l'article (Optionnelle)", name: "article_image", widget: "image", required: false, hint: "Si laissée vide, l'image de miniature sera utilisée" }
      - { label: "Position de l'image (après le paragraphe N)", name: "image_position", widget: "number", default: 0, min: 0, required: false, hint: "0 = l'image apparaît au-dessus de tout le texte. 1, 2, 3... = elle apparaît après ce paragraphe." }
      - { label: "Intensité du filtre sombre (page catégorie)", name: "overlay_opacity", widget: "number", default: 75, value_type: "int", min: 0, max: 100, required: false, hint: "Voile sombre sur la carte hero des pages Politique / Culture / Société / Technologie. 0 = image brute, 75 = défaut du site, 100 = très sombre. L'aperçu à droite se met à jour en direct." }

      - { label: "Visible sur le site ?", name: "isVisible", widget: "boolean", default: true, required: false }

      # --- INFOS AUTEUR & LECTURE ---
      - label: "Auteur de l'article"
        name: "author"
        widget: "select"
        options:
          - { label: "Victor Zhâ", value: "Victor Zhâ" }
          - { label: "Paul Delachaux", value: "Paul Delachaux" }
      - label: "Informations sur l'auteur"
        name: "author_info"
        widget: "list"
        required: false
        collapsed: false
        max : 1
        fields:
          - { label: "À propos de l'auteur (FR)", name: "author_about", widget: "text", default: "Aucune information fournie pour le moment.", required: false }
          - { label: "À propos de l'auteur (EN)", name: "author_about_en", widget: "text", default: "No information provided at this time.", required: false }
          - { label: "Déclaration d'intérêt (FR)", name: "author_interests", widget: "text", required: false }
          - { label: "Déclaration d'intérêt (EN)", name: "author_interests_en", widget: "text", required: false }
      
      - { label: "Temps de lecture (minutes)", name: "reading_time", widget: "number", default: 5, value_type: "int" }
      
      - label: "Sources consultables"
        name: "consulted_sources"
        widget: "list"
        summary: "{{fields.source_title}}"
        required: false
        fields:
          - { label: "Nom de la source (FR)", name: "source_title", widget: "string" }
          - { label: "Nom de la source (EN)", name: "source_title_en", widget: "string" }
          - { label: "Lien URL (Optionnel)", name: "source_url", widget: "string", required: false }

      - { label: "Tweet à intégrer (Optionnel)", name: "tweet_url", widget: "string", required: false, hint: "Colle l'URL complète du tweet, ex: https://x.com/nom_utilisateur/status/123456789" }
      - { label: "Position du tweet (après le paragraphe N)", name: "tweet_position", widget: "number", default: 0, min: 0, required: false, hint: "0 = le tweet apparaît au-dessus de tout le texte. 1, 2, 3... = il apparaît après ce paragraphe." }

      # --- MINIATURE CUSTOM ---
      - { label: "CONFIGURATION GRAPHIQUE DE LA MINIATURE (optionnel)", name: "sep_miniature", widget: "separator", required: false, collapsed: true }
      - { label: "Image Fond Miniature", name: "thumbnail_bg", widget: "image", required: false, title: "Partie Miniature (optionnel)" }
      - label: "Position du fond"
        name: "thumbnail_bg_position"
        widget: "select"
        default: "center"
        required: false
        options:
          - { label: "Centre", value: "center" }
          - { label: "Haut", value: "top" }
          - { label: "Bas", value: "bottom" }
          - { label: "Gauche", value: "left" }
          - { label: "Droite", value: "right" }
          - { label: "Haut gauche", value: "top left" }
          - { label: "Haut droite", value: "top right" }
          - { label: "Bas gauche", value: "bottom left" }
          - { label: "Bas droite", value: "bottom right" }
      - { label: "Zoom du fond (%)", name: "thumbnail_bg_zoom", widget: "number", default: 100, value_type: "int", min: 50, max: 300, required: false }

      - { label: "Titre sur la Miniature", name: "thumbnail_title", widget: "string", required: false }
      - { label: "Position X Titre (en px)", name: "title_x", widget: "number", default: 20, value_type: "int", min: 0, max: 500, required: false }
      - { label: "Position Y Titre (en px)", name: "title_y", widget: "number", default: 20, value_type: "int", min: 0, max: 300, required: false }
      - { label: "Taille police titre (px)", name: "title_size", widget: "number", default: 24, value_type: "int", min: 8, max: 80, required: false }
      - label: "Épaisseur police titre"
        name: "title_weight"
        widget: "select"
        default: "700"
        required: false
        options:
          - { label: "Fin (300)", value: "300" }
          - { label: "Normal (400)", value: "400" }
          - { label: "Gras (700)", value: "700" }
          - { label: "Ultra-Gras (900)", value: "900" }
      - label: "Police titre"
        name: "title_font"
        widget: "select"
        default: "sans-serif"
        required: false
        options:
          - { label: "Moderne (Sans-Serif)", value: "sans-serif" }
          - { label: "Journal (Serif)", value: "serif" }
          - { label: "Code (Monospace)", value: "monospace" }
      - { label: "Couleur titre (ex: #ffffff)", name: "title_color", widget: "color", default: "#ffffff", required: false }

      - label: "Blocs de description sur la Miniature"
        name: "thumbnail_descs"
        widget: "list"
        required: false
        summary: "{{fields.line}}"
        fields:
          - { label: "Texte", name: "line", widget: "string", required: false }
          - { label: "Position X (px)", name: "x", widget: "number", default: 20, value_type: "int", min: 0, max: 500, required: false }
          - { label: "Position Y (px)", name: "y", widget: "number", default: 80, value_type: "int", min: 0, max: 300, required: false }
          - { label: "Taille police (px)", name: "size", widget: "number", default: 14, value_type: "int", min: 8, max: 60, required: false }
          - label: "Épaisseur"
            name: "weight"
            widget: "select"
            default: "400"
            options:
              - { label: "Fin (300)", value: "300" }
              - { label: "Normal (400)", value: "400" }
              - { label: "Gras (700)", value: "700" }
              - { label: "Ultra-Gras (900)", value: "900" }
          - label: "Police"
            name: "font"
            widget: "select"
            default: "sans-serif"
            options:
              - { label: "Moderne (Sans-Serif)", value: "sans-serif" }
              - { label: "Journal (Serif)", value: "serif" }
              - { label: "Code (Monospace)", value: "monospace" }
          - { label: "Couleur (ex: #e1e8ed)", name: "color", widget: "color", default: "#e1e8ed" }

      - { label: "Utiliser la miniature custom ?", name: "use_thumbnail", widget: "boolean", default: false, required: false }

  # ==========================================
  # 2. COLLECTION : BRÈVES (Création / Édition)
  # ==========================================
  - name: "breves"
    label: "Brèves"
    label_singular: "Brève"
    folder: "src/content/articles"
    create: true
    slug: "{{slug}}"
    filter: { field: "layout_type", value: "breve" }
    fields:
      - { name: "layout_type", widget: "hidden", default: "breve" }
      # --- VERSION FRANCAISE ---
      - { name: "version_fr_sep", widget: "separator", label: "🇫🇷 Version Française", collapsed: false, required: false }
      - { name: "title", label: "Titre de la brève (FR)", widget: "string" }
      - { name: "description", label: "Description (FR)", widget: "string" }
      - { name: "body", label: "Texte court", widget: "markdown" }

      # --- VERSION ANGLAISE (FACULTATIVE) ---
      - { name: "version_en_sep", widget: "separator", label: "🇬🇧 Version Anglaise (Optionnelle)", collapsed: false, required: false }
      - { name: "title_en", label: "Titre de la brève (EN)", widget: "string", required: false }
      - { name: "description_en", label: "Description (EN)", widget: "string", required: false }
      - { name: "body_en", label: "Texte court", widget: "markdown", required: false }

      - { label: "INFORMATIONS GÉNÉRALES DE L'ARTICLE", name: "sep_article", widget: "separator", required: false }
      - { label: "Date de publication", name: "date", widget: "datetime" }
      - label: "Auteur de l'article"
        name: "author"
        widget: "select"
        options:
          - { label: "Victor Zhâ", value: "Victor Zhâ" }
          - { label: "Paul Delachaux", value: "Paul Delachaux" }

      - label: "Informations sur l'auteur"
        name: "author_info"
        widget: "list"
        required: false
        collapsed: false
        max : 1
        fields:
          - { label: "À propos de l'auteur (FR)", name: "author_about", widget: "text", default: "Aucune information fournie pour le moment.", required: false }
          - { label: "À propos de l'auteur (EN)", name: "author_about_en", widget: "text", default: "No information provided at this time.", required: false }
          - { label: "Déclaration d'intérêt (FR)", name: "author_interests", widget: "text", required: false }
          - { label: "Déclaration d'intérêt (EN)", name: "author_interests_en", widget: "text", required: false }

      - { label: "Catégorie", name: "category", widget: "select", options: ["politique", "culture", "societe", "technologie"] }
      - { label: "Image de miniature", name: "image", widget: "image" }
      - label: "Légende de l'image (Optionnelle)"
        name: "image_info"
        widget: "list"
        required: false
        min: 1
        default:
          - image_caption: ""
            image_caption_en: ""
        collapsed: false
        fields:
          - { name: "image_caption", label: "Légende de l'image (FR)", widget: "string", required: false }
          - { name: "image_caption_en", label: "Légende de l'image (EN)", widget: "string", required: false }

      - { label: "Position de l'image (après le paragraphe N)", name: "image_position", widget: "number", default: 0, min: 0, required: false, hint: "0 = l'image apparaît au-dessus de tout le texte. 1, 2, 3... = elle apparaît après ce paragraphe." }
      - { label: "Intensité du filtre sombre (page catégorie)", name: "overlay_opacity", widget: "number", default: 75, value_type: "int", min: 0, max: 100, required: false, hint: "Voile sombre sur la carte hero des pages Politique / Culture / Société / Technologie. 0 = image brute, 75 = défaut du site, 100 = très sombre. L'aperçu à droite se met à jour en direct." }
      - { label: "Visible sur le site ?", name: "isVisible", widget: "boolean", default: true, required: false }

      - label: "Sources consultables"
        name: "consulted_sources"
        widget: "list"
        summary: "{{fields.source_title}}"
        required: false
        fields:
          - { label: "Nom de la source (FR)", name: "source_title", widget: "string" }
          - { label: "Nom de la source (EN)", name: "source_title_en", widget: "string", required: false }
          - { label: "Lien URL (Optionnel)", name: "source_url", widget: "string", required: false }

  # ==========================================
  # 3. VUES FILTRÉES : ARTICLES PAR CATÉGORIE
  # ==========================================
  - name: "articles_politique"
    label: "Politique"
    folder: "src/content/articles"
    filter: { field: "category", value: "politique" }
    create: false
    fields:
      - { label: "Titre", name: "title", widget: "string" }
      - { label: "Visible sur le site ?", name: "isVisible", widget: "boolean", default: true, required: false }

  - name: "articles_culture"
    label: "Culture"
    folder: "src/content/articles"
    filter: { field: "category", value: "culture" }
    create: false
    fields:
      - { label: "Titre", name: "title", widget: "string" }
      - { label: "Visible sur le site ?", name: "isVisible", widget: "boolean", default: true, required: false }

  - name: "articles_societe"
    label: "Société"
    folder: "src/content/articles"
    filter: { field: "category", value: "societe" }
    create: false
    fields:
      - { label: "Titre", name: "title", widget: "string" }
      - { label: "Visible sur le site ?", name: "isVisible", widget: "boolean", default: true, required: false }

  - name: "articles_technologie"
    label: "Technologie"
    folder: "src/content/articles"
    filter: { field: "category", value: "technologie" }
    create: false
    fields:
      - { label: "Titre", name: "title", widget: "string" }
      - { label: "Visible sur le site ?", name: "isVisible", widget: "boolean", default: true, required: false }

  # ==========================================
  # 5. VUES FILTRÉES : PAR VISIBILITÉ
  # ==========================================
  - name: "contenus_visibles"
    label: "👁️ En ligne / Visibles"
    folder: "src/content/articles"
    filter: { field: "isVisible", value: true }
    create: false
    fields:
      - { label: "Titre", name: "title", widget: "string" }
      - { label: "Visible sur le site ?", name: "isVisible", widget: "boolean" }

  - name: "contenus_masques"
    label: "🚫 Masqués / Non visibles"
    folder: "src/content/articles"
    filter: { field: "isVisible", value: false }
    create: false
    fields:
      - { label: "Titre", name: "title", widget: "string" }
      - { label: "Visible sur le site ?", name: "isVisible", widget: "boolean" }

  # ==========================================
  # 6. PARAMÈTRES DU SITE
  # ==========================================
  - name: "settings"
    label: "Paramètres"
    delete: false
    editor:
      preview: false
    files:
      - name: "homepage"
        label: "Configuration Accueil"
        file: "src/data/settings.json"
        fields:
          # --- ARTICLE A LA UNE ---
          - { label: "Article à la une", name: "sep_article_une", widget: "separator", required: false }
          - label: "Article à la une"
            name: "heroArticle"
            widget: "relation-filtered"
            collection: "contenus_visibles"
            search_fields: ["title"]
            value_field: "{{slug}}"
            display_fields: ["title"]

          # --- SECTION DROITE (HAUT - LONG) ---
          - { label: "Première sidebar", name: "sep_sidebar_long", widget: "separator", required: false }
          - label: "Sidebar : Premier article (Format Long)"
            name: "sidebarLongArticle"
            widget: "relation-filtered"
            collection: "contenus_visibles"
            search_fields: ["title"]
            value_field: "{{slug}}"
            display_fields: ["title"]
            required: false

          # --- SECTION DROITE (BAS - DEUX PETITS) ---
          - label: "Sidebar : Deux articles du bas"
            name: "sidebarSmallArticles"
            widget: "list"
            summary: "Article : {{article}}"
            min: 0
            max: 2
            allow_duplicate: false
            required: false
            field:
              label: "Article"
              name: "article"
              widget: "relation-filtered"
              collection: "contenus_visibles"
              search_fields: ["title"]
              value_field: "{{slug}}"
              display_fields: ["title"]
              required: false

          # --- SECTION DU BAS (TROIS ARTICLES) ---
          - { label: "Deuxième sidebar", name: "sep_sidebar_mid", widget: "separator", required: false }
          - label: "Rangée du bas (Maximum 3 articles)"
            name: "bottomArticles"
            widget: "list"
            summary: "Article : {{article}}"
            min: 0
            max: 3
            allow_duplicate: false
            required: false
            field:
              label: "Article"
              name: "article"
              widget: "relation-filtered"
              collection: "contenus_visibles"
              search_fields: ["title"]
              value_field: "{{slug}}"
              display_fields: ["title"]
              required: false

          - label: "Styles de la rangée du bas"
            name: "bottomArticlesStyles"
            widget: "list"
            summary: "Configuration du style — Taille : {{titleSize}}, Police : {{titleFont}}"
            min: 0
            max: 3
            required: false
            fields:
              - label: "Taille du titre"
                name: "titleSize"
                widget: "select"
                default: "1.2rem"
                required: false
                options:
                  - { label: "Petit (1rem)", value: "1rem" }
                  - { label: "Normal (1.2rem)", value: "1.2rem" }
                  - { label: "Grand (1.6rem)", value: "1.6rem" }

              - label: "Épaisseur du titre"
                name: "titleWeight"
                widget: "select"
                default: "700"
                required: false
                options:
                  - { label: "Fin (300)", value: "300" }
                  - { label: "Normal (400)", value: "400" }
                  - { label: "Gras (700)", value: "700" }
                  - { label: "Ultra-Gras (900)", value: "900" }

              - label: "Style de police"
                name: "titleFont"
                widget: "select"
                default: "sans-serif"
                required: false
                options:
                  - { label: "Moderne (Sans-Serif)", value: "sans-serif" }
                  - { label: "Journal / Classique (Serif)", value: "serif" }
                  - { label: "Code (Monospace)", value: "monospace" }

          # --- NOUVELLE SECTION : LES 3 ARTICLES SUPERPOSÉS (GAUCHE) ---
          - { label: "Troisième sidebar", name: "sep_sidebar_left", widget: "separator", required: false }
          - label: "Asymétrique : 3 Articles Superposés (Gauche)"
            name: "asymLeftArticles"
            widget: "list"
            summary: "Article : {{article}}"
            min: 0
            max: 3
            allow_duplicate: false
            required: false
            field:
              label: "Article"
              name: "article"
              widget: "relation-filtered"
              collection: "contenus_visibles"
              search_fields: ["title"]
              value_field: "{{slug}}"
              display_fields: ["title"]
              required: false

          - label: "Asymétrique : Styles des 3 articles superposés"
            name: "asymLeftStyles"
            widget: "list"
            summary: "Style — Taille : {{titleSize}}, Police : {{titleFont}}"
            min: 0
            max: 3
            required: false
            fields:
              - label: "Taille du titre"
                name: "titleSize"
                widget: "select"
                default: "1.1rem"
                required: false
                options:
                  - { label: "Petit (1rem)", value: "1rem" }
                  - { label: "Normal (1.1rem)", value: "1.1rem" }
                  - { label: "Grand (1.4rem)", value: "1.4rem" }
              - label: "Épaisseur du titre"
                name: "titleWeight"
                widget: "select"
                default: "700"
                required: false
                options:
                  - { label: "Fin (300)", value: "300" }
                  - { label: "Normal (400)", value: "400" }
                  - { label: "Gras (700)", value: "700" }
              - label: "Style de police"
                name: "titleFont"
                widget: "select"
                default: "sans-serif"
                required: false
                options:
                  - { label: "Moderne (Sans-Serif)", value: "sans-serif" }
                  - { label: "Journal (Serif)", value: "serif" }
                  - { label: "Code (Monospace)", value: "monospace" }

          # --- NOUVELLE SECTION : LE GRAND ARTICLE UNIQUE (DROITE) ---
          - { label: "Article géant", name: "sep_giant_article", widget: "separator", required: false }
          - label: "Asymétrique : Grand Article Principal (Droite)"
            name: "asymRightArticle"
            widget: "relation-filtered"
            collection: "contenus_visibles"
            search_fields: ["title"]
            value_field: "{{slug}}"
            display_fields: ["title"]
            required: false

          - label: "Asymétrique : Style du Grand Article"
            name: "asymRightStyle"
            widget: "object"
            required: false
            fields:
              - label: "Taille du titre"
                name: "titleSize"
                widget: "select"
                default: "1.8rem"
                required: false
                options:
                  - { label: "Normal (1.5rem)", value: "1.5rem" }
                  - { label: "Grand (1.8rem)", value: "1.8rem" }
                  - { label: "Géant (2.2rem)", value: "2.2rem" }
              - label: "Épaisseur du titre"
                name: "titleWeight"
                widget: "select"
                default: "700"
                required: false
                options:
                  - { label: "Normal (400)", value: "400" }
                  - { label: "Gras (700)", value: "700" }
              - label: "Style de police"
                name: "titleFont"
                widget: "select"
                default: "sans-serif"
                required: false
                options:
                  - { label: "Moderne (Sans-Serif)", value: "sans-serif" }
                  - { label: "Journal (Serif)", value: "serif" }
                  - { label: "Code (Monospace)", value: "monospace" }

      # ==========================================
      # CONFIGURATION DES PAGES DE CATÉGORIES
      # ==========================================
      - name: "categories"
        label: "Configuration Catégories"
        file: "src/data/categories.json"
        fields:

          # --- POLITIQUE ---
          - { label: "POLITIQUE", name: "sep_politique", widget: "separator", required: false, collapsed: true }
          - label: "Politique : 3 articles mis en avant (Gauche)"
            name: "politique_topArticles"
            widget: "list"
            summary: "Article : {{article}}"
            min: 0
            max: 3
            allow_duplicate: false
            required: false
            field:
              label: "Article"
              name: "article"
              widget: "relation-filtered"
              target_category: "politique"
              collection: "articles_politique"
              required: false
              search_fields: ["title"]
              value_field: "{{slug}}"
              display_fields: ["title"]

          - label: "Politique : Styles des 3 articles"
            name: "politique_topStyles"
            widget: "list"
            summary: "Style — Titre: {{titleSize}} / Desc: {{descSize}}"
            min: 0
            max: 3
            required: false
            fields:
              - { label: "Taille du titre (ex: 1.2rem)", name: "titleSize", widget: "string", default: "1.2rem", required: false }
