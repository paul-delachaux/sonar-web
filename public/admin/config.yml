  # ==========================================
  # 7. DOMAINES DU SITE
  # ==========================================
  - name: "domains"
    label: "Domaines"
    delete: false
    files:
      - name: "domains"
        label: "Domaines"
        file: "src/data/domains.json"
        editor:
          preview: true
        fields:
          - label: "Domaines du site"
            name: "domains"
            widget: "list"
            label_singular: "Domaine"
            summary: "{{label}}"
            collapsed: true
            minimize_collapsed: true
            sortable: true
            min: 1
            allow_add: true
            hint: "Glisse les barres (poignée à droite) pour changer l’ordre dans les menus. Chaque domaine a une page /slug et apparaît dans les menus s’il est visible. Ne renomme pas un slug déjà utilisé par des articles : masque le domaine à la place. La suppression d’un domaine encore rattaché à des articles ou à des sous-domaines est refusée."
            fields:
              - { label: "Nom (FR)", name: "label", widget: "string", hint: "Affiché dans le menu, ex. Politique" }
              - { label: "Nom (EN)", name: "labelEn", widget: "string", hint: "Affiché dans le menu en anglais, ex. Politics" }
              - label: "Slug (URL)"
                name: "slug"
                widget: "string"
                hint: "Minuscules, chiffres, tirets. Devient l’adresse /mon-slug. Ex. politique, election-2027."
                pattern: ['^[a-z0-9]+(?:-[a-z0-9]+)*$', 'Minuscules, chiffres et tirets uniquement (ex. election-2027)']
              - { label: "Visible sur le site ?", name: "visible", widget: "boolean", default: true, hint: "Non = absent des menus, la page /slug renvoie 404. Les articles restent classés dans ce domaine." }
          - label: "Sous-domaines"
            name: "subdomains"
            widget: "list"
            label_singular: "Sous-domaine"
            summary: "{{label}} → {{parent}}"
            collapsed: true
            minimize_collapsed: true
            sortable: true
            required: false
            allow_add: true
            hint: "Mêmes champs qu’un domaine, plus le domaine principal. Au survol du domaine dans le menu, la liste des sous-domaines s’affiche. La page du domaine principal liste aussi les articles de ses sous-domaines ; la page du sous-domaine ne liste que les siens."
            fields:
              - { label: "Nom (FR)", name: "label", widget: "string", hint: "Affiché dans le menu, ex. Élection 2027" }
              - { label: "Nom (EN)", name: "labelEn", widget: "string", hint: "Affiché dans le menu en anglais, ex. 2027 Election" }
              - label: "Slug (URL)"
                name: "slug"
                widget: "string"
                hint: "Minuscules, chiffres, tirets. Devient l’adresse /mon-slug. Ne pas réutiliser un slug de domaine."
                pattern: ['^[a-z0-9]+(?:-[a-z0-9]+)*$', 'Minuscules, chiffres et tirets uniquement (ex. election-2027)']
              - label: "Domaine principal"
                name: "parent"
                widget: "relation"
                collection: "domains"
                file: "domains"
                search_fields: ["domains.*.label", "domains.*.slug"]
                value_field: "domains.*.slug"
                display_fields: ["domains.*.label"]
                options_length: 50
                hint: "Le sous-domaine apparaît au survol de ce domaine dans les menus."
              - { label: "Visible sur le site ?", name: "visible", widget: "boolean", default: true, hint: "Non = absent des menus, la page /slug renvoie 404. Les articles restent visibles sur la page du domaine principal." }